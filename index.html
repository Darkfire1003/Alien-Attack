<!doctype html>
<html lang="de" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SpaceAttack</title>
    <link rel="stylesheet" href="output.css" />
  </head>

  <body class="m-0 h-screen overflow-hidden bg-[#1a0a2e] text-white">
    <div class="flex h-full flex-col">
      <header class="shrink-0 border-b border-blue-700/60 bg-[#1a0a2e]/90">
        <h1 class="py-3 text-center text-3xl font-bold md:text-5xl">
          Alien ATTACK
        </h1>
      </header>

      <main class="flex min-h-0 flex-1 items-center justify-center overflow-hidden px-4">
        <div class="flex w-full max-w-[720px] flex-col items-center gap-3">
          <canvas
            id="canvas"
            width="720"
            height="480"
            class="block w-full max-w-[720px] bg-black"
          ></canvas>

          <div id="mobile-controls" class="w-full md:hidden">
            <div class="flex w-full items-center justify-between">
              <div class="flex flex-col gap-4">
                <button
                  id="btn-up"
                  class="rounded-full bg-blue-600 px-5 py-4 font-bold text-white active:scale-95"
                >
                  ▲
                </button>

                <button
                  id="btn-down"
                  class="rounded-full bg-blue-600 px-5 py-4 font-bold text-white active:scale-95"
                >
                  ▼
                </button>
              </div>

              <button
                id="btn-shoot"
                class="rounded-full bg-yellow-500 px-5 py-4 font-bold text-black active:scale-95"
              >
                SHOOT
              </button>
            </div>
          </div>

          <div class="flex gap-4">
            <button
              id="start-btn"
              onclick="startGame()"
              class="rounded-md bg-green-600 px-5 py-2 font-semibold text-white transition-all duration-150 hover:bg-green-400 hover:text-black"
            >
              Spiel starten
            </button>

            <button
              id="restart-btn"
              onclick="restartGame()"
              class="hidden rounded-md bg-red-600 px-5 py-2 font-semibold text-white transition-all duration-150 hover:bg-red-400 hover:text-black"
            >
              Neustart
            </button>
          </div>
        </div>
      </main>

      <footer class="shrink-0 border-t border-blue-700/60 bg-[#1a0a2e]/90 py-1">
        <p class="text-center text-sm">&copy; 2026 Kuscher Michael</p>
      </footer>
    </div>

    <script src="scripts.js"></script>
  </body>
</html>
