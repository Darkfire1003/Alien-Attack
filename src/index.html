<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>SpaceAttack</title>
    <link
      rel="stylesheet"
      href="output.css"
    />
  </head>

  <body class="flex min-h-screen flex-col">
    <header
      class="container h-28 flex justify-between items-center bg-linear-to-t from-[#1a0a2e] via-[#1b1b8f]/80 via-100% to-transparent"
    >
      <h1 class="w-full font-bold text-5xl text-center text-amber-50">
        Alien ATTACK
      </h1>
    </header>
    <main
      class="container flex flex-1 justify-center items-center bg-[#1a0a2e]"
    >
      <div class="flex flex-col items-center gap-4">
        <canvas
          id="canvas"
          width="720"
          height="480"
          class="w-full max-w-180 h-auto"
        ></canvas>
        <div
          id="mobile-controls"
          class="mt-4 w-full md:hidden"
        >
          <div class="flex w-full items-center justify-between px-4">
            <div class="flex flex-col gap-5">
              <button
                id="btn-up"
                class="rounded-full bg-blue-600 px-5 py-4 text-white font-bold active:scale-95"
              >
                ▲
              </button>

              <button
                id="btn-down"
                class="rounded-full bg-blue-600 px-5 py-4 text-white font-bold active:scale-95"
              >
                ▼
              </button>
            </div>

            <button
              id="btn-shoot"
              class="rounded-full bg-yellow-500 px-5 py-4 text-black font-bold active:scale-95"
            >
              SHOOT
            </button>
          </div>
        </div>

        <div class="flex gap-4">
          <button
            id="start-btn"
            onclick="startGame()"
            class="rounded-md bg-green-600 px-5 py-2 text-white font-semibold hover:bg-green-400 hover:text-black transition-all duration-150"
          >
            Spiel starten
          </button>

          <button
            id="restart-btn"
            onclick="restartGame()"
            class="rounded-md bg-red-600 px-5 py-2 text-white font-semibold hover:bg-red-400 hover:text-black transition-all duration-150 hidden"
          >
            Neustart
          </button>
        </div>
      </div>
    </main>

    <footer
      class="container bg-linear-to-b from-[#1a0a2e] via-[#1b1b8f]/80 via-100% to-transparent"
    >
      <p class="text-center text-white">&copy; 2026 Kuscher Michael</p>
    </footer>
    <!-- Script -->
    <script src="scripts.js"></script>
  </body>
</html>
